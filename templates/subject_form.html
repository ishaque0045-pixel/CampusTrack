{% extends "base.html" %}
{% block title %}{{ action }} Subject{% endblock %}
{% block page_title %}{{ action }} Subject{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white fw-bold">
        <i class="bi bi-book me-2 text-primary"></i>{{ action }} Subject
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="row g-3">
            <div class="col-md-5">
              <label class="form-label">Subject Code <span class="text-danger">*</span></label>
              <input type="text" class="form-control" name="subject_code"
                     value="{{ subject.subject_code|default('') }}" required
                     placeholder="e.g. CS101">
            </div>
            <div class="col-md-7">
              <label class="form-label">Subject Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" name="subject_name"
                     value="{{ subject.subject_name|default('') }}" required
                     placeholder="e.g. Introduction to Programming">
            </div>
            <div class="col-md-8">
              <label class="form-label">Department <span class="text-danger">*</span></label>
              <input type="text" class="form-control" name="department"
                     value="{{ subject.department|default('') }}" required
                     placeholder="e.g. Computer Science">
            </div>
            <div class="col-md-4">
              <label class="form-label">Semester <span class="text-danger">*</span></label>
              <select class="form-select" name="semester" required>
                <option value="">Select</option>
                {% for i in range(1, 9) %}
                <option value="{{ i }}"
                  {% if subject.semester|default(0)|int == i %}selected{% endif %}>
                  Semester {{ i }}
                </option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-circle me-1"></i>{{ action }} Subject
            </button>
            <a href="{{ url_for('subjects') }}" class="btn btn-outline-secondary">
              <i class="bi bi-arrow-left me-1"></i>Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
