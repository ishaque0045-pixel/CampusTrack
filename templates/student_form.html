{% extends "base.html" %}
{% block title %}{{ action }} Student{% endblock %}
{% block page_title %}{{ action }} Student{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white fw-bold">
        <i class="bi bi-person-badge me-2 text-primary"></i>{{ action }} Student
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Roll Number <span class="text-danger">*</span></label>
              <input type="text" class="form-control" name="roll_number"
                     value="{{ student.roll_number|default('') }}" required
                     placeholder="e.g. CS2401">
            </div>
            <div class="col-md-6">
              <label class="form-label">Full Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" name="full_name"
                     value="{{ student.full_name|default('') }}" required
                     placeholder="Student's full name">
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" name="email"
                     value="{{ student.email|default('') }}"
                     placeholder="student@college.edu">
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input type="tel" class="form-control" name="phone"
                     value="{{ student.phone|default('') }}"
                     placeholder="10-digit number">
            </div>
            <div class="col-md-8">
              <label class="form-label">Department <span class="text-danger">*</span></label>
              <input type="text" class="form-control" name="department"
                     value="{{ student.department|default('') }}" required
                     placeholder="e.g. Computer Science">
            </div>
            <div class="col-md-4">
              <label class="form-label">Semester <span class="text-danger">*</span></label>
              <select class="form-select" name="semester" required>
                <option value="">Select</option>
                {% for i in range(1, 9) %}
                <option value="{{ i }}"
                  {% if student.semester|default(0)|int == i %}selected{% endif %}>
                  Semester {{ i }}
                </option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-circle me-1"></i>{{ action }} Student
            </button>
            <a href="{{ url_for('students') }}" class="btn btn-outline-secondary">
              <i class="bi bi-arrow-left me-1"></i>Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
